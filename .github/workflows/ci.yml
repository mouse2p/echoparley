name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv venv .venv --python ${{ matrix.python }}
      - run: uv pip install --python .venv/bin/python -e '.[dev,torch]' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: make build
      - run: make test-all
      - run: make format-check
      - run: make lint
      - run: make typecheck
