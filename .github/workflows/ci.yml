name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv venv .venv --python ${{ matrix.python }}
      - run: uv pip install --python .venv/bin/python -e '.[dev,torch]' --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - run: make build
      - name: Smoke test installed wheel
        run: |
          uv venv .wheel-venv --python ${{ matrix.python }}
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/python scripts/check_package.py
      - run: make test-all
      - run: make format-check
      - run: make lint
      - run: make typecheck
