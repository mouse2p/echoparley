[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "echoparley"
version = "0.1.0"
description = "Offline-first mechanics workbench for full-duplex spoken dialogue"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Wang Yuanyi", email = "250376329+mouse2p@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
torch = ["torch>=2.5"]

[project.scripts]
echoparley = "echoparley.cli:main"

[project.urls]
Repository = "https://github.com/mouse2p/echoparley"
Issues = "https://github.com/mouse2p/echoparley/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/echoparley"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: training or integration test excluded from per-commit checks",
  "model: optional PyTorch model test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["echoparley"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

